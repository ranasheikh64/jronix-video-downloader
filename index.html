<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/jronix-video-downloader/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="video_download">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jronix Video Downloader</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      background: #0F172A;
      transition: opacity 0.6s ease-out;
    }
    .loading-container.hide {
      opacity: 0;
      pointer-events: none;
    }
    .logo-pulse {
      width: 120px;
      height: 120px;
      animation: pulse 2s infinite ease-in-out;
      border-radius: 25px;
    }
    .spinner {
      margin-top: 40px;
      width: 45px;
      height: 45px;
      border: 4px solid rgba(255,255,255,0.05);
      border-left-color: #6366F1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 25px rgba(99, 102, 241, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader" class="loading-container">
    <img src="only_icon.png" alt="Loading..." class="logo-pulse" />
    <div class="spinner"></div>
  </div>

  <script>
    // Remove loader once Flutter has rendered the first frame
    const checkFlutter = setInterval(() => {
      const flutterView = document.querySelector('flutter-view');
      if (flutterView && flutterView.shadowRoot && flutterView.shadowRoot.querySelector('canvas')) {
        document.getElementById('loader').classList.add('hide');
        clearInterval(checkFlutter);
      }
    }, 100);
    // Fallback just in case
    setTimeout(() => { 
      const loader = document.getElementById('loader');
      if (loader) loader.classList.add('hide'); 
    }, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
